mixed-port: 7890
mode: rule
log-level: warning
dns:
  enable: true
  nameserver:
    - "8.8.8.8"
    - "1.1.1.1"
proxies:
proxy-groups:
  - name: "V2Pool"
    type: select
    proxies:
      - "Auto"
  - name: "Auto"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
rules:
  - DOMAIN-SUFFIX,ir,DIRECT
  - GEOIP,IR,DIRECT,no-resolve
  - MATCH,V2Pool