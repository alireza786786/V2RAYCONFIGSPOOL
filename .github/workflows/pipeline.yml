name: pipeline

on:
  schedule:
    # اجرا هر ۴۵ دقیقه (منطبق بر چرخه استراحت ضد اسپم)
    - cron: "0,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download & Extract Engines
        run: |
          mkdir -p bin

          # دانلود مستقیم آخرین نسخه رسمی و پایدار Xray
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -oq /tmp/xray.zip xray -d bin

          # دریافت خودکار آدرس آخرین نسخه رسمی و پایدار Sing-box
          python3 -c '
          import urllib.request, json
          req = urllib.request.Request("https://api.github.com/repos/SagerNet/sing-box/releases/latest", headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req).read())
          url = [a["browser_download_url"] for a in data["assets"] if a["name"].endswith("linux-amd64.tar.gz") and "musl" not in a["name"]][0]
          urllib.request.urlretrieve(url, "/tmp/sb.tgz")
          '

          # استخراج و انتقال مستقل از نام پوشه
          tar -xzf /tmp/sb.tgz -C /tmp
          find /tmp -type f -name "sing-box" -exec mv {} bin/ \;
          chmod +x bin/xray bin/sing-box

      - name: Verify Engines
        run: |
          ./bin/xray version | head -n 1
          ./bin/sing-box version | head -n 1

      # بازیابی بانک و سوابق از شاخه main (در صورت وجود)
      - name: Restore Previous Bank
        run: |
          mkdir -p dist
          [ -f bank.json ] && cp bank.json dist/bank.json || echo "First run: no bank.json"
          [ -f results.json ] && cp results.json dist/results.json || echo "First run: no results.json"

      - name: Run Pipeline Core
        env:
          XRAY_BIN: ${{ github.workspace }}/bin/xray
          SINGBOX_BIN: ${{ github.workspace }}/bin/sing-box
          CONCURRENCY: "64"
          VALIDATE_TIMEOUT: "4.5"
          # سکرت‌ها بدون هیچ ردپایی در کد فراخوانی می‌شوند
          SOURCES_RAW: ${{ secrets.SOURCES_RAW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.main

      # انتشار مستقیم روی شاخه اصلی (main) با تکنیک Rolling Squash
      - name: Deploy to Main Branch
        run: |
          cp -r dist/* ./
          rm -rf dist bin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update node pool [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
