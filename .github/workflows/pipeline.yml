name: pipeline

on:
  schedule:
    # اجرا در دقایق ۱۳ و ۴۳ هر ساعت (آف‌پیک جهت جلوگیری از لغو یا تأخیر گیت‌هاب)
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download & Extract Engines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin /tmp/sb_extract

          # دانلود آخرین نسخه رسمی و واقعی Xray با ابزار رسمی گیت‌هاب (ضد ارور 404 و 403)
          gh release download --repo XTLS/Xray-core --pattern "Xray-linux-64.zip" --output /tmp/xray.zip --clobber
          unzip -oq /tmp/xray.zip xray -d bin/

          # دانلود آخرین نسخه رسمی و واقعی Sing-box
          gh release download --repo SagerNet/sing-box --pattern "*linux-amd64.tar.gz" --output /tmp/sb.tgz --clobber
          tar -xzf /tmp/sb.tgz -C /tmp/sb_extract
          
          # استخراج هوشمند باینری sing-box مستقل از نام پوشه
          find /tmp/sb_extract -type f -name "sing-box" -exec mv {} bin/ \;

          # پاکسازی و دادن دسترسی اجرایی
          rm -rf /tmp/xray.zip /tmp/sb.tgz /tmp/sb_extract
          chmod +x bin/xray bin/sing-box

      - name: Verify Engines
        run: |
          ./bin/xray version | head -n 1
          ./bin/sing-box version | head -n 1

      - name: Prepare Workspace
        run: |
          mkdir -p dist
          [ -f bank.json ] && cp bank.json dist/bank.json || echo "No previous bank.json"
          [ -f results.json ] && cp results.json dist/results.json || echo "No previous results.json"

      - name: Run Pipeline Core
        env:
          ARISTON_XRAY: ${{ github.workspace }}/bin/xray
          ARISTON_SINGBOX: ${{ github.workspace }}/bin/sing-box
          XRAY_BIN: ${{ github.workspace }}/bin/xray
          SINGBOX_BIN: ${{ github.workspace }}/bin/sing-box
          ARISTON_CONCURRENCY: "64"
          ARISTON_TIMEOUT: "4.5"
          CONCURRENCY: "64"
          VALIDATE_TIMEOUT: "4.5"
          SOURCES_RAW: ${{ secrets.SOURCES_RAW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.main run || python -m pipeline.main

      - name: Deploy to Main Branch
        run: |
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            cp -rf dist/* ./
          fi
          rm -rf dist bin

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update node pool [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes detected."
          fi
