name: pipeline

on:
  schedule:
    # اجرا در دقایق ۱۳ و ۴۳ هر ساعت (آف‌پیک جهت جلوگیری از لغو یا تأخیر گیت‌هاب)
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  XRAY_VERSION: "26.10.29"
  SINGBOX_VERSION: "1.14.4"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # کپی‌برداری دقیق از فایل اول جهت دانلود بدون ارور ۴۰۴ و بدون ارور ۴۰۳
      - name: Fetch engines
        run: |
          mkdir -p bin
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" || \
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -oq /tmp/xray.zip xray -d bin

          curl -fsSL -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          mv "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" bin/
          chmod +x bin/xray bin/sing-box

      - name: Verify engines
        run: bin/xray version | head -1 && bin/sing-box version | head -1

      - name: Prepare Workspace
        run: |
          mkdir -p dist
          [ -f bank.json ] && cp bank.json dist/bank.json || echo "No previous bank.json"
          [ -f results.json ] && cp results.json dist/results.json || echo "No previous results.json"

      - name: Run Pipeline Core
        env:
          ARISTON_XRAY: ${{ github.workspace }}/bin/xray
          ARISTON_SINGBOX: ${{ github.workspace }}/bin/sing-box
          XRAY_BIN: ${{ github.workspace }}/bin/xray
          SINGBOX_BIN: ${{ github.workspace }}/bin/sing-box
          ARISTON_CONCURRENCY: "64"
          ARISTON_TIMEOUT: "4.5"
          CONCURRENCY: "64"
          VALIDATE_TIMEOUT: "4.5"
          SOURCES_RAW: ${{ secrets.SOURCES_RAW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.main run || python -m pipeline.main

      - name: Deploy to Main Branch
        run: |
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            cp -rf dist/* ./
          fi
          rm -rf dist bin

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update node pool [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes detected."
          fi
