- name: Download & Extract Engines
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin

          # دانلود آخرین نسخه پایدار Xray بدون وابستگی به شماره نسخه
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -oq /tmp/xray.zip xray -d bin

          # دریافت خودکار آدرس آخرین نسخه پایدار Sing-box از API گیت‌هاب
          python3 -c '
          import urllib.request, json
          req = urllib.request.Request("https://api.github.com/repos/SagerNet/sing-box/releases/latest", headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req).read())
          url = [a["browser_download_url"] for a in data["assets"] if a["name"].endswith("linux-amd64.tar.gz") and "musl" not in a["name"]][0]
          urllib.request.urlretrieve(url, "/tmp/sb.tgz")
          '
          
          # استخراج و انتقال مستقل از نام پوشه
          tar -xzf /tmp/sb.tgz -C /tmp
          find /tmp -type f -name "sing-box" -exec mv {} bin/ \;
          chmod +x bin/xray bin/sing-box
